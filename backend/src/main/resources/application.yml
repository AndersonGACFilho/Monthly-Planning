spring:
  application:
    name: planejamento-mensal
  main:
    banner-mode: off
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      # Flyway owns the schema; SQLite needs "INTEGER PRIMARY KEY" where Hibernate expects bigint
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      location: ${app.home}/data/tmp

app:
  # Folder of the executables; the shell passes it (POR-03). Development falls back to the working dir.
  home: ${APP_HOME:${user.dir}}
  # Random token created by the shell for this launch (IMP-04); the API refuses to start without it.
  session-token: ${APP_SESSION_TOKEN:}
  web:
    allowed-origins: tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:5173

server:
  # Only reachable from this computer; the shell passes the port it picked (POR-08).
  address: 127.0.0.1
  port: ${PORT:0}
  tomcat:
    basedir: ${app.home}/data/tmp/tomcat

springdoc:
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/hal+json

management:
  endpoints:
    web:
      exposure:
        # shutdown lets the shell stop the backend cleanly on Windows and Linux (POR-08, POR-11)
        include: health,shutdown
  endpoint:
    shutdown:
      access: unrestricted

# TST-07: tests, Javadoc and coverage on every pull request and every push to main; PRs merge only when green.
# Other branches run through their pull request only, so a branch with an open PR is tested once per push.
# POR-15: app.jar built once; jlink + tauri build per OS; one portable zip for Windows and Linux.
# POR-17: every green commit on main is released as v<VERSION>.<commits since VERSION changed>.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Version (POR-17)
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: compute
        # Only main is released; other refs build a pre-release the app never offers
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then FLAG=; else FLAG=--dev; fi
          echo "version=$(python3 scripts/version.py compute $FLAG)" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan coverage and release scripts (AGT-08, POR-17)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_plan_coverage.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  backend:
    name: Backend (tests, Javadoc, coverage)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/version.py apply ${{ needs.version.outputs.version }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        working-directory: backend
        run: ./mvnw -B verify
      - name: Javadoc and coverage reports (DOC-04, TST-04)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-reports
          path: |
            backend/target/reports/apidocs
            backend/target/site/jacoco
      - uses: actions/upload-artifact@v5
        with:
          name: app-jar
          path: backend/target/app.jar

  frontend:
    name: Frontend (types, lint, i18n, tests, build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, Chromium and WebKit)
    needs: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: backend/target
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright (IMP-40, IMP-45, IMP-48, I18N-14)
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: frontend/test-results

  shell:
    # POR-16: the update moves a running executable and whole folders; Windows locks files differently than Linux
    name: Shell unit tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend build needed by tauri::generate_context
        working-directory: frontend
        run: npm ci && npm run build
      - working-directory: src-tauri
        run: cargo test

  package:
    name: Portable package (${{ matrix.os }})
    needs: [version, backend, frontend, shell]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            shell: src-tauri/target/release/PlanejamentoMensal.exe
          - runner: ubuntu-22.04
            os: linux
            shell: src-tauri/target/release/PlanejamentoMensal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: python scripts/version.py apply ${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: backend/target
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries for Tauri
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Minimal JRE (jlink)
        run: python scripts/build_runtime.py backend/target/app.jar build/runtime
      - name: Tauri build
        run: frontend/node_modules/.bin/tauri build ${{ matrix.os == 'linux' && '--bundles appimage' || '--no-bundle' }}
      - name: Assemble portable folder
        shell: bash
        run: >-
          python scripts/assemble_portable.py --os ${{ matrix.os }} --shell ${{ matrix.shell }}
          --jar backend/target/app.jar --runtime build/runtime --out dist/PlanejamentoMensal
          ${{ matrix.os == 'linux' && '--appimage src-tauri/target/release/bundle/appimage/*.AppImage' || '' }}
      - name: Portable smoke test (IMP-07)
        run: python scripts/portable_smoke.py dist/PlanejamentoMensal --os ${{ matrix.os }}
      - name: exFAT drive mounted noexec (POR-02, POR-09)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get install -y exfatprogs
          truncate -s 1G exfat.img && mkfs.exfat exfat.img
          sudo mkdir -p /media/ssd
          # Runner kernels may ship exFAT as a module, in the extra modules package or not at all: use the kernel
          # driver when it loads, else the FUSE driver. Both mount with noexec, which is what this step checks.
          sudo modprobe exfat || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe exfat; } || true
          if grep -qw exfat /proc/filesystems; then
            sudo mount -o loop,noexec,uid=$(id -u),gid=$(id -g) exfat.img /media/ssd
          else
            sudo apt-get install -y exfat-fuse
            sudo mount.exfat-fuse -o noexec,uid=$(id -u),gid=$(id -g),allow_other "$(sudo losetup --show -f exfat.img)" /media/ssd
          fi
          findmnt /media/ssd
          ! cp /bin/true /media/ssd/probe 2>/dev/null || ! /media/ssd/probe || { echo "/media/ssd is not noexec"; exit 1; }
          rm -f /media/ssd/probe
          cp -r dist/PlanejamentoMensal /media/ssd/
          JRE=$(mktemp -d) && cp -r /media/ssd/PlanejamentoMensal/backend/runtime-linux/. "$JRE"
          python scripts/portable_smoke.py /media/ssd/PlanejamentoMensal --os linux --in-place --java "$JRE/bin/java"
          sudo umount /media/ssd
      - name: Data folder written on Windows for the Linux run (IMP-50, POR-01)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p crossos && cp -r dist/PlanejamentoMensal crossos/
          python scripts/portable_smoke.py crossos/PlanejamentoMensal --os windows --in-place --write-marker windows
      - uses: actions/upload-artifact@v5
        if: matrix.os == 'windows'
        with:
          name: data-windows
          path: crossos/PlanejamentoMensal/data
      - uses: actions/upload-artifact@v5
        with:
          name: portable-${{ matrix.os }}
          path: dist/PlanejamentoMensal

  bundle:
    name: Single zip for Windows and Linux (POR-15)
    needs: [version, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo
      - uses: actions/download-artifact@v5
        with:
          name: portable-linux
          path: PlanejamentoMensal
      - uses: actions/download-artifact@v5
        with:
          name: portable-windows
          path: PlanejamentoMensal
      - name: Restore execute bits lost by artifacts
        run: chmod +x PlanejamentoMensal/PlanejamentoMensal PlanejamentoMensal/backend/runtime-linux/bin/*
      - name: Copy for the cross-OS data check
        run: mkdir -p crossos && cp -r PlanejamentoMensal crossos/
      - uses: actions/download-artifact@v5
        with:
          name: data-windows
          path: crossos/PlanejamentoMensal/data
      - name: Same data folder opened on Linux after Windows (IMP-50, POR-01)
        run: python3 repo/scripts/portable_smoke.py crossos/PlanejamentoMensal --os linux --in-place --expect-marker windows
      - name: Zip
        # Named after the version (POR-15, POR-17). The SHA-256 file is what the app checks the download against
        # before installing it (POR-16).
        env:
          NAME: PlanejamentoMensal-v${{ needs.version.outputs.version }}.zip
        run: |
          zip -r -9 "$NAME" PlanejamentoMensal
          sha256sum "$NAME" > "$NAME.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: PlanejamentoMensal-zip
          path: PlanejamentoMensal-*.zip*

  release:
    # Tags only a commit on main whose every check passed; a re-run finds the release and leaves it as it is
    name: GitHub release (IMP-47, POR-17)
    needs: [version, plan, e2e, bundle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: release-${{ github.sha }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: PlanejamentoMensal-zip
      - name: Publish the zip and its SHA-256 with the commits since the previous release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then echo "$TAG is already released"; exit 0; fi
          python3 scripts/release_notes.py > notes.md
          gh release create "$TAG" "PlanejamentoMensal-$TAG.zip" "PlanejamentoMensal-$TAG.zip.sha256" \
            --target "$GITHUB_SHA" --title "Planejamento Mensal $TAG" --notes-file notes.md
